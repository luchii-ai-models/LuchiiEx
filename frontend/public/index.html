<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Luchii — autonomous neon BTC trading terminal by Frasberg, Inc." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>Luchii Ex</title>
        <script>try{if(location.pathname!=="/login"&&(localStorage.getItem("luchii_theme")||"dark")==="light"){document.documentElement.classList.add("light");}}catch(e){}</script>
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" href="/icon-32.png" />
        <link rel="apple-touch-icon" href="/icon-180.png" />
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
